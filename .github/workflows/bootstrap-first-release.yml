name: Bootstrap first release tag

on:
  workflow_run:
    workflows: ["CI", "Docs"]
    types: [completed]

concurrency:
  group: bootstrap-first-release-v0.1.0a1
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require exact current main and both successful release gates
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: v0.1.0a1
        run: |
          set -euo pipefail
          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TARGET_SHA" != "$MAIN_SHA" ]; then
            echo "Stale workflow_run: target=$TARGET_SHA current-main=$MAIN_SHA; not releasing."
            exit 0
          fi

          VERSION="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          test "$VERSION" = "${RELEASE_TAG#v}" || {
            echo "Version/tag mismatch: version=$VERSION tag=$RELEASE_TAG" >&2
            exit 1
          }

          for workflow in ci.yml docs.yml; do
            echo "Requiring successful push run for $workflow at $TARGET_SHA..."
            ok="$(gh run list --workflow "$workflow" --commit "$TARGET_SHA" --branch main --limit 30 \
              --json conclusion,event,headSha \
              --jq "[.[] | select(.event == \"push\" and .headSha == \"$TARGET_SHA\" and .conclusion == \"success\")] | length")"
            test "$ok" -ge 1 || {
              echo "Other release gate is not yet green for exact main; a later workflow_run event will retry."
              exit 0
            }
          done

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            git merge-base --is-ancestor "$TAG_COMMIT" "$TARGET_SHA" || {
              echo "Existing immutable tag is not an ancestor of current main: tag=$TAG_COMMIT main=$TARGET_SHA" >&2
              exit 1
            }
            mapfile -t post_tag_paths < <(git diff --name-only "$TAG_COMMIT..$TARGET_SHA")
            for path in "${post_tag_paths[@]}"; do
              case "$path" in
                .github/workflows/bootstrap-first-release.yml|.github/workflows/release.yml|tests/test_release_packaging.py)
                  ;;
                *)
                  echo "Existing release tag is stale because post-tag main contains non-orchestration change: $path" >&2
                  exit 1
                  ;;
              esac
            done
            echo "$RELEASE_TAG remains the certified immutable package tag at $TAG_COMMIT; post-tag main is orchestration-only."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "GazeForge ${RELEASE_TAG} - first public alpha release"
            git push origin "refs/tags/$RELEASE_TAG"
            TAG_COMMIT="$TARGET_SHA"
            echo "Created immutable release tag $RELEASE_TAG at $TAG_COMMIT"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; no dispatch needed."
            exit 0
          fi

          active="$(gh run list --workflow release.yml --limit 30 \
            --json status,headBranch,event \
            --jq '[.[] | select(.headBranch == "main" and .event == "workflow_dispatch" and (.status == "queued" or .status == "in_progress"))] | length')"
          if [ "$active" -ge 1 ]; then
            echo "Release workflow is already active from current main; not dispatching a duplicate."
            exit 0
          fi

          gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"
          echo "Dispatched current-main release.yml explicitly for certified immutable tag $RELEASE_TAG."
