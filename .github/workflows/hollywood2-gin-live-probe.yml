name: Hollywood2 GIN live source probe

on:
  push:
    branches:
      - main
      - research/hollywood2-gin-live-probe
      - research/hollywood2-coordinate-metadata
      - validation/hollywood2-gin-host-availability
    paths:
      - "scripts/hollywood2_gin_live_probe.py"
      - "scripts/hollywood2_gin_resilient_probe.py"
      - "scripts/hollywood2_coordinate_metadata_probe.py"
      - "src/gazeforge/hollywood2_evidence.py"
      - "src/gazeforge/hollywood2_coordinate_metadata.py"
      - "src/gazeforge/hollywood2_coordinate_evidence.py"
      - "src/gazeforge/source_resolution.py"
      - "src/gazeforge/source_resolution_dashboard.py"
      - "tests/test_hollywood2_evidence.py"
      - "tests/test_hollywood2_gin_resilient_probe.py"
      - "tests/test_hollywood2_source_resolution.py"
      - "tests/test_hollywood2_coordinate_metadata.py"
      - "tests/test_hollywood2_coordinate_evidence.py"
      - "tests/test_docs_hook.py"
      - "tests/test_source_resolution*.py"
      - "validation/evidence/hollywood2/**"
      - "validation/protocols/hollywood2-source-resolution-*.json"
      - "validation/history/source-resolution/hollywood2-source-resolution-*.json"
      - "validation/governance/source-resolution-bundle-lock-v1.json"
      - "docs/hollywood2-authoritative-evidence.md"
      - "docs/hollywood2-source-resolution.md"
      - "docs/source-resolution-status.md"
      - "docs/api-reference.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/hollywood2-gin-live-probe.yml"
      - ".github/workflows/hollywood2-coordinate-metadata-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref != 'refs/heads/research/hollywood2-coordinate-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure anonymous GIN transport
        shell: bash
        run: |
          set -euo pipefail
          git config --global \
            url."https://gin.g-node.org/ioannis.agtzidis/hollywood2_em".insteadOf \
            "https://gin.g-node.org/ioannis.agtzidis/hollywood2_em.git"
      - name: Probe canonical Hollywood2EM GIN repository
        id: live_probe
        shell: bash
        run: |
          set -uo pipefail
          probe_exit=1
          attempts=0
          for attempt in 1 2 3 4 5; do
            attempts="$attempt"
            if python scripts/hollywood2_gin_resilient_probe.py --attempt "$attempt"; then
              probe_exit=0
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "GIN probe attempt ${attempt} failed; retrying after ${delay}s." >&2
              sleep "$delay"
            fi
          done
          echo "exit_code=${probe_exit}" >> "$GITHUB_OUTPUT"
          echo "attempts=${attempts}" >> "$GITHUB_OUTPUT"
      - name: Install package
        if: steps.live_probe.outputs.exit_code == '0'
        run: python -m pip install .
      - name: Bind live source audit to frozen evidence
        if: steps.live_probe.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          from gazeforge.hollywood2_evidence import validate_hollywood2_gin_probe
          validate_hollywood2_gin_probe(
              Path("hollywood2_gin_live_probe.json"),
              Path(
                  "validation/evidence/hollywood2/"
                  "hollywood2-authoritative-ground-truth-evidence-v1.json"
              ),
          )
          print("Hollywood2 authoritative live probe is bound to frozen evidence.")
          PY
      - name: Summarize source-resolution result
        if: steps.live_probe.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("hollywood2_gin_live_probe.json").read_text())
          ground = record["ground_truth"]
          comparison = ground["student_final_comparison"]
          sampling = ground["sampling_rate"]
          print("HEAD:", record["head"]["commit_sha1"])
          print("default_ref:", record["remote"]["default_ref"])
          print("tree entries:", record["tree"]["entry_count"])
          print("ARFF paths:", record["tree"]["arff_path_count"])
          print("ground-truth files:", ground["file_count"])
          print("ground-truth rows:", ground["total_rows"])
          print("ground-truth bytes:", ground["total_bytes"])
          print("splits:", ground["splits"])
          print("clips:", ground["clip_count"])
          print("file subject tokens:", ground["file_subject_token_count"])
          print("schema signatures:", ground["schema_signatures"])
          print("label counts:", ground["global_label_counts"])
          print("student/final samples:", comparison["sample_count"])
          print("student/final changed:", comparison["changed_sample_count"])
          print("student/final raw agreement:", comparison["raw_agreement_fraction"])
          print(
              "median file rate assuming microseconds:",
              sampling["median_file_rate_hz_assuming_time_us"],
          )
          print("license files:", [item["path"] for item in record["license_files"]])
          print("fingerprint:", record["probe_fingerprint_sha256"])
          PY
      - name: Validate fail-closed availability record
        if: steps.live_probe.outputs.exit_code != '0'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("hollywood2_gin_live_probe.json")
          record = json.loads(path.read_text(encoding="utf-8"))
          assert record["record_type"] == "hollywood2-gin-live-probe-unavailable-v1"
          assert record["status"] == "canonical_repository_route_unavailable"
          assert record["attempt"] == int("${{ steps.live_probe.outputs.attempts }}")
          body = dict(record)
          stored = body.pop("probe_fingerprint_sha256")
          canonical = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
          assert stored == hashlib.sha256(canonical).hexdigest()
          boundary = record["scientific_boundary"]
          assert boundary["authoritative_repository_revision_resolved_in_this_attempt"] is False
          assert boundary["dataset_license_verified"] is False
          assert boundary["participant_identity_mapping_verified"] is False
          assert boundary["cross_dataset_validation_created"] is False
          assert boundary["new_frozen_evidence_performance_claim_created"] is False
          assert boundary["scientific_reproduction_failure_inferred"] is False
          print("failure class:", record["child_probe"]["failure_class"])
          print("HTTP status:", record["child_probe"]["http_status"])
          print("attempt:", record["attempt"])
          print("fingerprint:", stored)
          PY
      - name: Upload deterministic probe record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollywood2-gin-live-probe
          path: hollywood2_gin_live_probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when canonical GIN route is unavailable
        if: steps.live_probe.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Canonical GIN probe remained unavailable after bounded retries." >&2
          exit 1

  coordinate-metadata:
    if: github.ref == 'refs/heads/research/hollywood2-coordinate-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and focused tooling
        run: python -m pip install . pytest ruff
      - name: Ruff focused files
        run: |
          ruff check \
            src/gazeforge/hollywood2_coordinate_metadata.py \
            src/gazeforge/hollywood2_coordinate_evidence.py \
            scripts/hollywood2_coordinate_metadata_probe.py \
            tests/test_hollywood2_coordinate_metadata.py \
            tests/test_hollywood2_coordinate_evidence.py
      - name: Run focused coordinate evidence tests
        run: |
          python -m pytest -q \
            tests/test_hollywood2_coordinate_metadata.py \
            tests/test_hollywood2_coordinate_evidence.py
      - name: Revalidate exact author input convention
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/MikhailStartsev/deep_em_classifier/9a345a37aab47ac6780ce0d4b5798cc15291c75b/README.md"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
            "$url" -o _hollywood2_author_readme.md
          observed="$(git hash-object _hollywood2_author_readme.md)"
          test "$observed" = "112f5f2a235f059ac2394db3180956474e644c06"
          python - <<'PY'
          from pathlib import Path
          from gazeforge.hollywood2_coordinate_evidence import validate_author_input_convention
          validate_author_input_convention(
              Path("_hollywood2_author_readme.md").read_text(encoding="utf-8")
          )
          print("exact author ARFF input convention verified")
          PY
      - name: Acquire pinned canonical Hollywood2EM source
        shell: bash
        run: |
          set -euo pipefail
          expected="870fa6d6209c9085260918d61433a0a2c70fd497"
          canonical="https://gin.g-node.org/ioannis.agtzidis/hollywood2_em"
          legacy="https://web.gin.g-node.org/ioannis.agtzidis/hollywood2_em"
          clone_once() {
            local endpoint="$1"
            rm -rf _hollywood2_em
            if ! git clone --depth 1 "$endpoint" _hollywood2_em; then
              return 1
            fi
            observed="$(git -C _hollywood2_em rev-parse HEAD)"
            test "$observed" = "$expected"
            test -z "$(git -C _hollywood2_em status --porcelain --untracked-files=no)"
            return 0
          }
          for endpoint in "$canonical" "$canonical" "$canonical" "$legacy" "$legacy"; do
            if clone_once "$endpoint"; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not acquire the pinned Hollywood2EM source through bounded public routes." >&2
          exit 1
      - name: Run header-only coordinate metadata probe
        run: |
          python scripts/hollywood2_coordinate_metadata_probe.py \
            --source-root _hollywood2_em \
            --output hollywood2-coordinate-metadata-live-probe.json
      - name: Bind fresh headers to immutable coordinate evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from gazeforge.hollywood2_coordinate_evidence import (
              validate_live_probe_against_coordinate_evidence,
          )
          evidence = validate_live_probe_against_coordinate_evidence(
              Path("hollywood2-coordinate-metadata-live-probe.json"),
              Path(
                  "validation/evidence/hollywood2/"
                  "hollywood2-coordinate-semantics-evidence-v1.json"
              ),
          )
          print("coordinate evidence fingerprint:", evidence["evidence_fingerprint_sha256"])
          print("verified coordinate unit:", evidence["verification"]["coordinate_unit"])
          print(
              "participant mapping verified:",
              evidence["scientific_boundary"]["participant_identity_mapping_verified"],
          )
          print(
              "cross-dataset validation created:",
              evidence["scientific_boundary"]["cross_dataset_validation_created"],
          )
          PY
      - name: Upload metadata-only probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollywood2-coordinate-metadata-live-probe
          path: hollywood2-coordinate-metadata-live-probe.json
          if-no-files-found: error
          retention-days: 30
