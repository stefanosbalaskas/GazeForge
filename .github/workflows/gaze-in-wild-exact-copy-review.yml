name: Gaze-in-the-Wild exact-copy review

on:
  push:
    branches:
      - main
      - research/gaze-in-wild-exact-copy-review
      - research/gaze-in-wild-structured-quarantine-binding
    paths:
      - "src/gazeforge/gaze_in_wild_exact_copy_review.py"
      - "src/gazeforge/gaze_in_wild_first_party_readiness.py"
      - "src/gazeforge/gaze_in_wild_candidate_preflight.py"
      - "src/gazeforge/gaze_in_wild_recovery.py"
      - "src/gazeforge/gaze_in_wild_quarantine_exit.py"
      - "src/gazeforge/source_candidate.py"
      - "src/gazeforge/source_candidate_cli.py"
      - "tests/test_gaze_in_wild_exact_copy_review.py"
      - "tests/test_gaze_in_wild_quarantine_exit.py"
      - "tests/test_gaze_in_wild_quarantine_exit_cli.py"
      - "docs/gaze-in-wild-exact-copy-review.md"
      - "mkdocs.yml"
      - ".github/workflows/gaze-in-wild-exact-copy-review.yml"
  pull_request:
    paths:
      - "src/gazeforge/gaze_in_wild_exact_copy_review.py"
      - "src/gazeforge/gaze_in_wild_first_party_readiness.py"
      - "src/gazeforge/gaze_in_wild_candidate_preflight.py"
      - "src/gazeforge/gaze_in_wild_recovery.py"
      - "src/gazeforge/gaze_in_wild_quarantine_exit.py"
      - "src/gazeforge/source_candidate.py"
      - "src/gazeforge/source_candidate_cli.py"
      - "tests/test_gaze_in_wild_exact_copy_review.py"
      - "tests/test_gaze_in_wild_quarantine_exit.py"
      - "tests/test_gaze_in_wild_quarantine_exit_cli.py"
      - "docs/gaze-in-wild-exact-copy-review.md"
      - "mkdocs.yml"
      - ".github/workflows/gaze-in-wild-exact-copy-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependency
        run: python -m pip install -e ".[dev]"
      - name: Ruff exact-copy review tranche
        run: >-
          ruff check
          src/gazeforge/gaze_in_wild_exact_copy_review.py
          src/gazeforge/gaze_in_wild_quarantine_exit.py
          src/gazeforge/source_candidate_cli.py
          tests/test_gaze_in_wild_exact_copy_review.py
          tests/test_gaze_in_wild_quarantine_exit.py
          tests/test_gaze_in_wild_quarantine_exit_cli.py
      - name: Run exact-copy and quarantine-exit regression tests
        run: >-
          pytest -q
          tests/test_gaze_in_wild_exact_copy_review.py
          tests/test_gaze_in_wild_quarantine_exit.py
          tests/test_gaze_in_wild_quarantine_exit_cli.py
