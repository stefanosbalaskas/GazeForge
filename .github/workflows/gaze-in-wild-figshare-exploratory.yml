name: Gaze-in-the-Wild Figshare exploratory metadata

on:
  push:
    branches:
      - research/giw-figshare-distribution-rights
    paths:
      - .github/workflows/gaze-in-wild-figshare-exploratory.yml

permissions:
  contents: write

jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public Figshare metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ids = {
              "ProcessData": 11673645,
              "ProcessData_cleaned": 11673717,
              "LabelData": 11673696,
          }

          def fetch_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GazeForgeEvidenceProbe/1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def item_view(label: str, article_id: int) -> dict:
              raw = fetch_json(f"https://api.figshare.com/v2/articles/{article_id}")
              files = []
              for item in raw.get("files", []):
                  files.append(
                      {
                          "id": item.get("id"),
                          "name": item.get("name"),
                          "size": item.get("size"),
                          "is_link_only": item.get("is_link_only"),
                          "download_url": item.get("download_url"),
                          "supplied_md5": item.get("supplied_md5"),
                          "computed_md5": item.get("computed_md5"),
                      }
                  )
              files.sort(key=lambda x: (str(x["name"]), int(x["id"] or 0)))
              return {
                  "label": label,
                  "id": raw.get("id"),
                  "title": raw.get("title"),
                  "doi": raw.get("doi"),
                  "url": raw.get("url"),
                  "url_public_api": raw.get("url_public_api"),
                  "defined_type_name": raw.get("defined_type_name"),
                  "version": raw.get("version"),
                  "published_date": raw.get("published_date"),
                  "modified_date": raw.get("modified_date"),
                  "authors": [
                      {
                          "id": author.get("id"),
                          "full_name": author.get("full_name"),
                          "orcid_id": author.get("orcid_id"),
                      }
                      for author in raw.get("authors", [])
                  ],
                  "license": raw.get("license"),
                  "files": files,
                  "file_count": len(files),
                  "total_size_bytes": sum(int(f["size"] or 0) for f in files),
              }

          items = [item_view(label, article_id) for label, article_id in ids.items()]
          project_articles = fetch_json(
              "https://api.figshare.com/v2/projects/74580/articles?page_size=100"
          )
          project_view = [
              {
                  "id": item.get("id"),
                  "title": item.get("title"),
                  "doi": item.get("doi"),
                  "url": item.get("url"),
                  "published_date": item.get("published_date"),
              }
              for item in project_articles
          ]
          project_view.sort(key=lambda x: int(x["id"] or 0))

          record = {
              "record_type": "gaze-in-wild-figshare-exploratory-metadata-v1",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "probe_scope": "public_metadata_only_no_dataset_file_downloads",
              "api_base": "https://api.figshare.com/v2",
              "project_id": 74580,
              "items": items,
              "project_articles": project_view,
          }
          canonical = json.dumps(
              record,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          record["probe_fingerprint_sha256"] = hashlib.sha256(canonical).hexdigest()
          path = Path("_giw_figshare_exploratory.json")
          path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          print("probe fingerprint:", record["probe_fingerprint_sha256"])
          for item in items:
              print(
                  item["label"],
                  "id=", item["id"],
                  "doi=", item["doi"],
                  "type=", item["defined_type_name"],
                  "version=", item["version"],
                  "license=", item["license"],
                  "files=", item["file_count"],
                  "bytes=", item["total_size_bytes"],
              )
          print("project article ids:", [x["id"] for x in project_view])
          PY
      - name: Commit probe snapshot to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 _giw_figshare_exploratory.json)"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/validation/probes/_exploratory-giw-figshare-metadata.json" \
            -f message='probe: record GIW Figshare metadata snapshot' \
            -f content="$encoded" \
            -f branch='research/giw-figshare-distribution-rights'
