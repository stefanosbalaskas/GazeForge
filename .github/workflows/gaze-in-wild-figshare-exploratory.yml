name: Gaze-in-the-Wild Figshare exploratory metadata

on:
  push:
    branches:
      - research/giw-figshare-distribution-rights
    paths:
      - .github/workflows/gaze-in-wild-figshare-exploratory.yml

permissions:
  contents: write

jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and derive public Figshare metadata only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ids = {
              "ProcessData": 11673645,
              "ProcessData_cleaned": 11673717,
              "LabelData": 11673696,
          }
          process_re = re.compile(r"^PrIdx_(\d+)_TrIdx_(\d+)\.mat$")
          label_re = re.compile(r"^PrIdx_(\d+)_TrIdx_(\d+)_Lbr_(\d+)\.mat$")

          def fetch_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GazeForgeEvidenceProbe/1.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def canonical_sha(value) -> str:
              body = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              return hashlib.sha256(body).hexdigest()

          def item_view(label: str, article_id: int) -> dict:
              raw = fetch_json(f"https://api.figshare.com/v2/articles/{article_id}")
              files = []
              for item in raw.get("files", []):
                  files.append(
                      {
                          "id": item.get("id"),
                          "name": item.get("name"),
                          "size": item.get("size"),
                          "is_link_only": item.get("is_link_only"),
                          "download_url": item.get("download_url"),
                          "supplied_md5": item.get("supplied_md5"),
                          "computed_md5": item.get("computed_md5"),
                      }
                  )
              files.sort(key=lambda x: (str(x["name"]), int(x["id"] or 0)))
              return {
                  "label": label,
                  "id": raw.get("id"),
                  "title": raw.get("title"),
                  "doi": raw.get("doi"),
                  "url": raw.get("url"),
                  "url_public_api": raw.get("url_public_api"),
                  "defined_type_name": raw.get("defined_type_name"),
                  "version": raw.get("version"),
                  "published_date": raw.get("published_date"),
                  "modified_date": raw.get("modified_date"),
                  "description": raw.get("description"),
                  "keywords": raw.get("keywords"),
                  "references": raw.get("references"),
                  "authors": [
                      {
                          "id": author.get("id"),
                          "full_name": author.get("full_name"),
                          "orcid_id": author.get("orcid_id"),
                      }
                      for author in raw.get("authors", [])
                  ],
                  "license": raw.get("license"),
                  "files": files,
                  "manifest_sha256": canonical_sha(files),
                  "file_count": len(files),
                  "total_size_bytes": sum(int(f["size"] or 0) for f in files),
              }

          items = [item_view(label, article_id) for label, article_id in ids.items()]
          by_label = {item["label"]: item for item in items}
          project_articles = fetch_json(
              "https://api.figshare.com/v2/projects/74580/articles?page_size=100"
          )
          project_view = [
              {
                  "id": item.get("id"),
                  "title": item.get("title"),
                  "doi": item.get("doi"),
                  "url": item.get("url"),
                  "published_date": item.get("published_date"),
              }
              for item in project_articles
          ]
          project_view.sort(key=lambda x: int(x["id"] or 0))

          checked = datetime.now(timezone.utc).isoformat()
          record = {
              "record_type": "gaze-in-wild-figshare-exploratory-metadata-v2",
              "checked_at_utc": checked,
              "probe_scope": "public_metadata_only_no_dataset_file_downloads",
              "api_base": "https://api.figshare.com/v2",
              "project_id": 74580,
              "items": items,
              "project_articles": project_view,
          }
          record["probe_fingerprint_sha256"] = canonical_sha(record)
          Path("_giw_figshare_exploratory_v2.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          process_cells = []
          for row in by_label["ProcessData"]["files"]:
              match = process_re.fullmatch(str(row["name"]))
              if match is None:
                  raise SystemExit(f"unexpected ProcessData filename: {row['name']}")
              process_cells.append((int(match.group(1)), int(match.group(2))))

          label_cells: dict[tuple[int, int], set[int]] = defaultdict(set)
          for row in by_label["LabelData"]["files"]:
              match = label_re.fullmatch(str(row["name"]))
              if match is None:
                  raise SystemExit(f"unexpected LabelData filename: {row['name']}")
              label_cells[(int(match.group(1)), int(match.group(2)))].add(
                  int(match.group(3))
              )

          process_names = {row["name"] for row in by_label["ProcessData"]["files"]}
          cleaned_names = {
              row["name"] for row in by_label["ProcessData_cleaned"]["files"]
          }
          summary = {
              "record_type": "gaze-in-wild-figshare-exploratory-summary-v2",
              "checked_at_utc": checked,
              "source_probe_fingerprint_sha256": record["probe_fingerprint_sha256"],
              "project_id": 74580,
              "project_article_ids": [row["id"] for row in project_view],
              "items": {
                  label: {
                      "id": item["id"],
                      "doi": item["doi"],
                      "title": item["title"],
                      "type": item["defined_type_name"],
                      "version": item["version"],
                      "license": item["license"],
                      "file_count": item["file_count"],
                      "total_size_bytes": item["total_size_bytes"],
                      "manifest_sha256": item["manifest_sha256"],
                      "author_names": [a["full_name"] for a in item["authors"]],
                      "description": item["description"],
                  }
                  for label, item in by_label.items()
              },
              "derived_manifest_structure": {
                  "processdata_participant_ids": sorted({p for p, _ in process_cells}),
                  "processdata_tridx_values": sorted({t for _, t in process_cells}),
                  "processdata_participant_trial_cells": [
                      [p, t] for p, t in sorted(set(process_cells))
                  ],
                  "processdata_cleaned_filename_set_equal": process_names == cleaned_names,
                  "labeldata_participant_ids": sorted({p for p, _ in label_cells}),
                  "labeldata_tridx_values": sorted({t for _, t in label_cells}),
                  "labeldata_labrater_ids": sorted(
                      {l for values in label_cells.values() for l in values}
                  ),
                  "labeldata_participant_trial_cell_count": len(label_cells),
                  "labeldata_multiple_labeller_cells": [
                      {"PrIdx": p, "TrIdx": t, "labellers": sorted(values)}
                      for (p, t), values in sorted(label_cells.items())
                      if len(values) > 1
                  ],
              },
          }
          summary["summary_fingerprint_sha256"] = canonical_sha(summary)
          Path("_giw_figshare_summary_v2.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("probe fingerprint:", record["probe_fingerprint_sha256"])
          print("summary fingerprint:", summary["summary_fingerprint_sha256"])
          for label, item in by_label.items():
              print(
                  label,
                  "license=", item["license"],
                  "files=", item["file_count"],
                  "bytes=", item["total_size_bytes"],
                  "manifest=", item["manifest_sha256"],
              )
          print("participants:", summary["derived_manifest_structure"]["processdata_participant_ids"])
          print("TrIdx:", summary["derived_manifest_structure"]["processdata_tridx_values"])
          print("label cells:", summary["derived_manifest_structure"]["labeldata_participant_trial_cell_count"])
          print("multiple-labeller cells:", summary["derived_manifest_structure"]["labeldata_multiple_labeller_cells"])
          PY
      - name: Commit probe snapshots to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            '_giw_figshare_exploratory_v2.json:validation/probes/_exploratory-giw-figshare-metadata-v2.json' \
            '_giw_figshare_summary_v2.json:validation/probes/_exploratory-giw-figshare-summary-v2.json'
          do
            local_path="${pair%%:*}"
            repo_path="${pair#*:}"
            encoded="$(base64 -w0 "$local_path")"
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/${repo_path}" \
              -f message='probe: record GIW Figshare derived metadata' \
              -f content="$encoded" \
              -f branch='research/giw-figshare-distribution-rights'
          done
