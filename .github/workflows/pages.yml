name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "validation/**"
      - "scripts/mkdocs_hooks.py"
      - "src/gazeforge/dashboard.py"
      - "src/gazeforge/evidence_details.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[docs]"
      - name: Build website
        run: mkdocs build --strict --site-dir site
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain disabled Pages
        if: steps.pages.outcome != 'success'
        run: echo "::notice::Website built successfully. Enable Settings > Pages > Source = GitHub Actions to publish it."
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.build.outputs.pages_configured == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
