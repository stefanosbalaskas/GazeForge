name: finalize GazeForge 0.1.0a2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-trigger-0.1.0a2.yml"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "docs/changelog.md"
      - "tests/test_release_packaging.py"

concurrency:
  group: finalize-gazeforge-0.1.0a2
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    name: freeze tag and dispatch protected release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fx "version = \"0.1.0a2\"" pyproject.toml
          grep -Fx "date-released: 2026-09-25" CITATION.cff
          grep -F "## 0.1.0a2 - 2026-09-25" CHANGELOG.md
          test -f RELEASE_NOTES_0.1.0a2.md

      - name: Wait for exact-main CI and Docs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_workflow () {
            workflow="$1"
            for attempt in $(seq 1 180); do
              row="$(gh run list \
                --workflow "$workflow" \
                --commit "$GITHUB_SHA" \
                --branch main \
                --event push \
                --limit 20 \
                --json status,conclusion,headSha,url \
                --jq '[.[] | select(.headSha == env.GITHUB_SHA)][0] // {}')"

              status="$(printf '%s' "$row" | jq -r '.status // ""')"
              conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "$workflow exact-main validation: SUCCESS"
                  return 0
                fi
                echo "$workflow exact-main validation failed: $conclusion" >&2
                printf '%s\n' "$row" >&2
                return 1
              fi

              echo "Waiting for $workflow at $GITHUB_SHA (attempt $attempt)..."
              sleep 10
            done

            echo "Timed out waiting for $workflow at $GITHUB_SHA" >&2
            return 1
          }

          wait_for_workflow ci.yml
          wait_for_workflow docs.yml

      - name: Create immutable annotated release tag if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0a2"

          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

          if git rev-parse "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
            echo "$TAG already exists at exact validated main."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "GazeForge 0.1.0a2"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $GITHUB_SHA"
          fi

      - name: Dispatch protected release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag=v0.1.0a2
          echo "Dispatched release.yml for v0.1.0a2"
