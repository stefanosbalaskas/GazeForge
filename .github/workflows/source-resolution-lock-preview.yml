name: Source-resolution lock preview

on:
  push:
    branches:
      - validation/gaze-in-wild-supplementary-identity
    paths:
      - 'validation/protocols/**'
      - 'validation/evidence/gaze-in-wild/**'
      - 'src/gazeforge/source_resolution*.py'
      - 'src/gazeforge/gaze_in_wild_supplementary_evidence.py'
      - 'scripts/build_source_resolution_governance_lock.py'
      - '.github/workflows/source-resolution-lock-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Build reviewed lock preview
        run: python scripts/build_source_resolution_governance_lock.py
