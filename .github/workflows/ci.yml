name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest --cov=gazeforge --cov-report=term-missing

  source-resolution-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e .
      - name: Validate committed source-resolution checkpoints and reviewed lock
        shell: bash
        run: |
          gazeforge-source-resolution \
            --directory validation/protocols \
            --lock validation/governance/source-resolution-bundle-lock-v1.json \
            > source-resolution-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("source-resolution-validation.json").read_text())
          bundle = payload["validation_bundle"]
          lock = payload["bundle_lock"]
          assert bundle["bundle_type"] == "source-resolution-validation-bundle-v1"
          assert bundle["record_count"] == 3
          records = {row["dataset_key"]: row for row in bundle["records"]}
          assert set(records) == {
              "gaze-in-the-wild",
              "hollywood2em",
              "visus",
          }
          assert bundle["bundle_fingerprint_sha256"] == (
              "6518614703d3ee99b54739365f0098d1a8df580e952cdcaecd33cdcaff49cebe"
          )
          assert all(not row["source_audit_ready"] for row in records.values())
          assert records["visus"]["empirical_evidence_created"] is False
          assert records["gaze-in-the-wild"]["empirical_evidence_created"] is False
          assert records["hollywood2em"]["empirical_evidence_created"] is True
          assert lock["matches_current_bundle"] is True
          assert lock["bundle_fingerprint_sha256"] == bundle["bundle_fingerprint_sha256"]
          assert lock["scientific_boundary"]["non_empirical_governance_only"] is True
          assert lock["scientific_boundary"]["authorizes_empirical_evidence"] is False
          PY

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: python -m pip install -U pip build && python -m build
      - name: Install wheel into clean virtual environment
        shell: bash
        run: |
          python -m venv /tmp/gazeforge-wheel-smoke
          /tmp/gazeforge-wheel-smoke/bin/python -m pip install -U pip
          /tmp/gazeforge-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/gazeforge-wheel-smoke/bin/python -c "import gazeforge; print(gazeforge.__version__)"
          /tmp/gazeforge-wheel-smoke/bin/gazeforge --version
          /tmp/gazeforge-wheel-smoke/bin/gazeforge-source-candidate --help \
            > /tmp/gazeforge-source-candidate-help.txt
          /tmp/gazeforge-wheel-smoke/bin/gazeforge-source-resolution \
            --directory validation/protocols \
            --lock validation/governance/source-resolution-bundle-lock-v1.json \
            > /tmp/gazeforge-source-resolution-smoke.json
