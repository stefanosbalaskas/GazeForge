name: GIW supplementary byte probe

on:
  push:
    branches:
      - research/giw-supplement-byte-probe
    paths:
      - .github/workflows/giw-supplement-byte-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF probe dependency
        run: python -m pip install pypdf
      - name: Acquire reviewed public documents
        shell: bash
        run: |
          set -u -o pipefail
          ua='Mozilla/5.0 (compatible; GazeForgeEvidenceProbe/1.0; +https://github.com/stefanosbalaskas/GazeForge)'

          ARXIV_FETCHED=0
          ARXIV_SOURCE_URL=''
          for url in \
            'https://export.arxiv.org/pdf/1905.13146v1' \
            'https://arxiv.org/pdf/1905.13146' \
            'https://export.arxiv.org/pdf/1905.13146'; do
            rm -f giw-arxiv-v1.pdf
            if curl --fail --show-error --silent --location \
              --user-agent "$ua" --retry 2 --retry-all-errors \
              "$url" -o giw-arxiv-v1.pdf; then
              if head -c 4 giw-arxiv-v1.pdf | grep -q '%PDF'; then
                ARXIV_FETCHED=1
                ARXIV_SOURCE_URL="$url"
                break
              fi
            fi
          done
          echo "ARXIV_FETCHED=$ARXIV_FETCHED" >> "$GITHUB_ENV"
          echo "ARXIV_SOURCE_URL=$ARXIV_SOURCE_URL" >> "$GITHUB_ENV"
          if [ "$ARXIV_FETCHED" != 1 ]; then rm -f giw-arxiv-v1.pdf; fi

          SPRINGER_FETCHED=0
          springer_url='https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41598-020-59251-5/MediaObjects/41598_2020_59251_MOESM1_ESM.pdf'
          rm -f giw-springer-supplement.pdf
          if curl --fail --show-error --silent --location \
            --user-agent "$ua" --retry 2 --retry-all-errors \
            "$springer_url" -o giw-springer-supplement.pdf; then
            if head -c 4 giw-springer-supplement.pdf | grep -q '%PDF'; then
              SPRINGER_FETCHED=1
            fi
          fi
          echo "SPRINGER_FETCHED=$SPRINGER_FETCHED" >> "$GITHUB_ENV"
          if [ "$SPRINGER_FETCHED" != 1 ]; then rm -f giw-springer-supplement.pdf; fi

          if [ "$ARXIV_FETCHED" != 1 ] && [ "$SPRINGER_FETCHED" != 1 ]; then
            echo 'Neither reviewed author nor publisher PDF was recoverable.' >&2
            exit 1
          fi
      - name: Build metadata-only probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          from pypdf import PdfReader

          def inspect_pdf(path: Path) -> dict[str, object]:
              raw = path.read_bytes()
              if not raw.startswith(b'%PDF'):
                  raise SystemExit(f'{path} is not a PDF')
              reader = PdfReader(str(path))
              text = '\n'.join((page.extract_text() or '') for page in reader.pages)
              canonical = re.sub(r'\s+', ' ', text).strip()
              return {
                  'byte_size': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'page_count': len(reader.pages),
                  'text_sha256_whitespace_canonical': hashlib.sha256(
                      canonical.encode('utf-8')
                  ).hexdigest(),
                  'markers': {
                      'dataset_status_and_error_measures': 'Dataset status and error measures' in text,
                      'indoor_navigation': 'Indoor navigation' in text,
                      'ball_catching': 'Ball catching' in text,
                      'visual_search': 'Visual search' in text,
                      'tea_making': 'Tea making' in text,
                      'person_23_age_60': bool(re.search(r'23\s+60', text)),
                      'data_discarded': 'Data discarded' in text,
                  },
              }

          result: dict[str, object] = {
              'record_type': 'giw-supplement-byte-probe-v1',
              'arxiv_identifier': '1905.13146v1',
              'arxiv_fetch_succeeded': os.environ.get('ARXIV_FETCHED') == '1',
              'arxiv_source_url': os.environ.get('ARXIV_SOURCE_URL', ''),
              'springer_official_supplement_url': (
                  'https://media.springernature.com/original/springer-static/esm/'
                  'art%3A10.1038%2Fs41598-020-59251-5/MediaObjects/'
                  '41598_2020_59251_MOESM1_ESM.pdf'
              ),
              'springer_fetch_succeeded': os.environ.get('SPRINGER_FETCHED') == '1',
          }
          arxiv = Path('giw-arxiv-v1.pdf')
          if arxiv.exists():
              result['arxiv'] = inspect_pdf(arxiv)
          springer = Path('giw-springer-supplement.pdf')
          if springer.exists():
              result['springer'] = inspect_pdf(springer)

          Path('giw-supplement-byte-probe.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Inspect escaped official table extraction
        if: env.SPRINGER_FETCHED == '1'
        shell: bash
        run: |
          python - <<'PY'
          from pypdf import PdfReader

          reader = PdfReader('giw-springer-supplement.pdf')
          for page_index, page in enumerate(reader.pages):
              text = page.extract_text() or ''
              if 'Dataset status and error measures' not in text:
                  continue
              print(f'TABLE_PAGE={page_index}')
              for line in text.splitlines():
                  escaped = line.encode('unicode_escape').decode('ascii')
                  print(escaped)
          PY
      - name: Upload metadata-only probe
        uses: actions/upload-artifact@v4
        with:
          name: giw-supplement-byte-probe
          path: giw-supplement-byte-probe.json
          if-no-files-found: error
          retention-days: 30
