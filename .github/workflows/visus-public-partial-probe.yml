name: VISUS public partial probe

on:
  push:
    branches:
      - feat/visus-public-partial-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact pinned-source probe
        run: python scripts/visus_public_partial_probe.py
      - name: Upload deterministic probe record
        uses: actions/upload-artifact@v4
        with:
          name: visus-public-partial-probe
          path: visus_public_partial_probe.json
          if-no-files-found: error
