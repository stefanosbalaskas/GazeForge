name: Gaze-in-the-Wild first-party readiness

on:
  push:
    branches:
      - main
      - research/gaze-in-wild-first-party-readiness
    paths:
      - "src/gazeforge/gaze_in_wild_first_party_readiness.py"
      - "src/gazeforge/gaze_in_wild_first_party_resolution.py"
      - "src/gazeforge/gaze_in_wild_candidate_preflight.py"
      - "src/gazeforge/gaze_in_wild_processdata_preflight.py"
      - "src/gazeforge/gaze_in_wild_recovery.py"
      - "tests/test_gaze_in_wild_first_party_readiness.py"
      - "validation/evidence/gaze-in-wild/**"
      - "validation/requests/gaze-in-wild/**"
      - ".github/workflows/gaze-in-wild-first-party-readiness.yml"
  pull_request:
    paths:
      - "src/gazeforge/gaze_in_wild_first_party_readiness.py"
      - "src/gazeforge/gaze_in_wild_first_party_resolution.py"
      - "src/gazeforge/gaze_in_wild_candidate_preflight.py"
      - "src/gazeforge/gaze_in_wild_processdata_preflight.py"
      - "src/gazeforge/gaze_in_wild_recovery.py"
      - "tests/test_gaze_in_wild_first_party_readiness.py"
      - "validation/evidence/gaze-in-wild/**"
      - "validation/requests/gaze-in-wild/**"
      - ".github/workflows/gaze-in-wild-first-party-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependency
        run: python -m pip install -e ".[dev]"
      - name: Ruff first-party readiness tranche
        run: >-
          ruff check
          src/gazeforge/gaze_in_wild_first_party_readiness.py
          tests/test_gaze_in_wild_first_party_readiness.py
      - name: Run first-party quarantine readiness tests
        run: pytest -q tests/test_gaze_in_wild_first_party_readiness.py
