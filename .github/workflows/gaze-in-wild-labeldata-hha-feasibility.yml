name: Gaze-in-the-Wild LabelData HHA feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/gaze-in-wild-labeldata-hha-feasibility
    paths:
      - ".github/workflows/gaze-in-wild-labeldata-hha-feasibility.yml"
      - "scripts/probe_gaze_in_wild_labeldata_hha_feasibility.py"
      - "validation/evidence/gaze-in-wild/gaze-in-wild-figshare-public-metadata-raw-v1.json"
      - "validation/evidence/gaze-in-wild/gaze-in-wild-figshare-exact-bytes-evidence-v1.json"

permissions:
  contents: read

jobs:
  labeldata-hha-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy scipy ruff

      - name: Ruff LabelData feasibility probe
        run: ruff check scripts/probe_gaze_in_wild_labeldata_hha_feasibility.py

      - name: Reverify and inspect original LabelData only
        run: |
          python scripts/probe_gaze_in_wild_labeldata_hha_feasibility.py \
            --frozen validation/evidence/gaze-in-wild/gaze-in-wild-figshare-public-metadata-raw-v1.json \
            --output gaze-in-wild-labeldata-hha-feasibility-probe-v1.json \
            --retries 3

      - name: Require fail-closed scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("gaze-in-wild-labeldata-hha-feasibility-probe-v1.json")
          record = json.loads(path.read_text(encoding="utf-8"))
          boundary = record["scientific_boundary"]
          assert boundary["exact_labeldata_bytes_reverified"] is True
          assert boundary["distribution_level_pairing_feasibility_inspected"] is True
          for key in (
              "human_human_agreement_created",
              "participant_disjoint_model_validation_created",
              "cross_dataset_validation_created",
              "gp3_validity_claim_created",
              "complete_file_to_publication_task_mapping_verified",
              "quarantine_exit_authorized",
              "new_empirical_performance_claim_created",
          ):
              assert boundary[key] is False, key
          assert record["raw_dataset_bytes_retained"] is False
          PY

      - name: Confirm raw LabelData was not retained in workspace
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name 'PrIdx_*_TrIdx_*_Lbr_*.mat' -print -quit | grep -q .; then
            echo "Raw GIW LabelData MAT file unexpectedly retained in workspace." >&2
            exit 1
          fi

      - name: Upload structural summary only
        uses: actions/upload-artifact@v4
        with:
          name: gaze-in-wild-labeldata-hha-feasibility
          path: gaze-in-wild-labeldata-hha-feasibility-probe-v1.json
          if-no-files-found: error
          retention-days: 30
