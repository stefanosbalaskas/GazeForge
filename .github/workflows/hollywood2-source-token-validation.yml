name: Hollywood2 source-token validation

on:
  push:
    branches:
      - main
      - research/hollywood2-source-token-validation
      - validation/hollywood2-source-token-frozen-evidence
    paths:
      - "src/gazeforge/__init__.py"
      - "src/gazeforge/hollywood2_token_validation.py"
      - "src/gazeforge/hollywood2_token_evidence.py"
      - "src/gazeforge/resampling.py"
      - "src/gazeforge/comparison.py"
      - "src/gazeforge/hollywood2.py"
      - "src/gazeforge/events.py"
      - "src/gazeforge/temporal.py"
      - "src/gazeforge/paired.py"
      - "src/gazeforge/stratified.py"
      - "scripts/run_hollywood2_source_token_validation.py"
      - "tests/test_hollywood2_token_validation.py"
      - "tests/test_hollywood2_token_evidence.py"
      - "tests/test_hollywood2_token_frozen_evidence.py"
      - "tests/test_resampling.py"
      - "validation/governance/hollywood2-source-token-analysis-authorization-v1.json"
      - "validation/evidence/hollywood2/**"
      - "docs/hollywood2-authoritative-evidence.md"
      - ".github/workflows/hollywood2-source-token-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install . pytest
      - name: Run source-token, evidence, and resampling contract tests
        run: |
          python -m pytest -q \
            tests/test_hollywood2_token_validation.py \
            tests/test_hollywood2_token_evidence.py \
            tests/test_hollywood2_token_frozen_evidence.py \
            tests/test_resampling.py
      - name: Validate committed operator authorization
        run: |
          python - <<'PY'
          from gazeforge.hollywood2_token_validation import (
              authorization_fingerprint,
              load_hollywood2_source_token_analysis_authorization,
          )

          path = (
              "validation/governance/"
              "hollywood2-source-token-analysis-authorization-v1.json"
          )
          authorization = load_hollywood2_source_token_analysis_authorization(path)
          print("authorization fingerprint:", authorization_fingerprint(authorization))
          print("participant mapping verified:", authorization.participant_identity_mapping_verified)
          print("raw redistribution authorized:", authorization.raw_source_redistribution_authorized)
          PY

  empirical:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Configure anonymous GIN transport
        shell: bash
        run: |
          set -euo pipefail
          git config --global \
            url."https://gin.g-node.org/ioannis.agtzidis/hollywood2_em".insteadOf \
            "https://gin.g-node.org/ioannis.agtzidis/hollywood2_em.git"
      - name: Clone pinned canonical Hollywood2EM source
        shell: bash
        run: |
          set -euo pipefail
          expected="870fa6d6209c9085260918d61433a0a2c70fd497"
          for attempt in 1 2 3 4 5; do
            rm -rf _hollywood2_em
            if git clone --depth 1 \
              https://gin.g-node.org/ioannis.agtzidis/hollywood2_em.git \
              _hollywood2_em; then
              observed="$(git -C _hollywood2_em rev-parse HEAD)"
              test "$observed" = "$expected"
              test -z "$(git -C _hollywood2_em status --porcelain --untracked-files=no)"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Canonical GIN clone failed after bounded retries." >&2
              exit 1
            fi
            delay=$((attempt * 20))
            echo "GIN clone attempt ${attempt} failed; retrying after ${delay}s." >&2
            sleep "$delay"
          done
      - name: Run derived-60-Hz source-token-held-out comparison
        run: |
          python scripts/run_hollywood2_source_token_validation.py \
            --source-root _hollywood2_em \
            --target-rate-hz 60 \
            --min-label-purity 0.75 \
            --folds 4 \
            --rf-trees 100 \
            --context-hidden 32,16 \
            --context-max-iter 50 \
            --output hollywood2-source-token-validation-v1.json
      - name: Bind live aggregate report to frozen evidence
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          from gazeforge.dashboard import load_frozen_benchmark_report
          from gazeforge.hollywood2_token_evidence import (
              HOLLYWOOD2_SOURCE_TOKEN_NUMERIC_CANONICALIZATION,
          )
          from gazeforge.hollywood2_token_validation import (
              validate_hollywood2_source_token_validation_report,
          )

          report_path = Path("hollywood2-source-token-validation-v1.json")
          frozen_path = Path(
              "validation/evidence/hollywood2/"
              "hollywood2-source-token-60hz-frozen-summary-v1.json"
          )
          report = validate_hollywood2_source_token_validation_report(report_path)
          frozen = load_frozen_benchmark_report(frozen_path)
          text = report_path.read_text(encoding="utf-8")

          protocol = report["protocol"]
          boundary = protocol["scientific_boundary"]
          frozen_protocol = frozen["protocol"]
          frozen_preparation = frozen_protocol["preparation"]
          preparation = protocol["preparation"]
          inventory = preparation["inventory"]

          assert boundary["participant_identity_mapping_verified"] is False
          assert boundary["participant_disjoint_validation_created"] is False
          assert boundary["participant_generalization_claim"] is False
          assert boundary["raw_source_redistributed_by_gazeforge"] is False
          assert boundary["raw_predictions_embedded"] is False
          assert protocol["numeric_canonicalization"] == (
              HOLLYWOOD2_SOURCE_TOKEN_NUMERIC_CANONICALIZATION
          )
          assert frozen_protocol["source_validation_numeric_canonicalization"] == (
              HOLLYWOOD2_SOURCE_TOKEN_NUMERIC_CANONICALIZATION
          )
          assert report["report_fingerprint_sha256"] == (
              frozen_protocol["source_validation_report_fingerprint_sha256"]
          )
          assert hashlib.sha256(report_path.read_bytes()).hexdigest() == (
              frozen_protocol["source_validation_report_file_sha256"]
          )
          assert report["benchmark"] == frozen["benchmark"]
          assert report["model"] == frozen["model"]
          for key in (
              "analysis_label_counts",
              "source_token_fold_assignment",
              "summary",
          ):
              assert report["metrics"][key] == frozen["metrics"][key]

          assert preparation["analysis_rows"] == frozen_preparation["analysis_rows"]
          assert preparation["analysis_sampling_rate_hz"] == (
              frozen_preparation["analysis_sampling_rate_hz"]
          )
          assert preparation["prepared_rows_before_exclusions"] == (
              frozen_preparation["prepared_rows_before_exclusions"]
          )
          assert preparation["excluded_rows"] == frozen_preparation["excluded_rows"]
          assert inventory["ground_truth_file_count"] == (
              frozen_preparation["ground_truth_file_count"]
          )
          assert inventory["ground_truth_sample_count"] == (
              frozen_preparation["ground_truth_sample_count"]
          )
          assert inventory["source_tokens"] == frozen_preparation["source_tokens"]
          assert inventory["source_token_count"] == frozen_preparation["source_token_count"]
          assert preparation["participant_identity_resolved"] is False
          assert preparation["raw_source_rows_embedded"] is False
          assert preparation["source_filenames_embedded"] is False
          assert ".arff" not in text
          assert "_hollywood2_em" not in text

          print("canonical report fingerprint:", report["report_fingerprint_sha256"])
          print("canonical report file sha256:", hashlib.sha256(report_path.read_bytes()).hexdigest())
          print("frozen summary fingerprint:", frozen["report_fingerprint_sha256"])
          print("claim boundary: source-token-held-out only")
          PY
      - name: Upload aggregate validation report only
        uses: actions/upload-artifact@v4
        with:
          name: hollywood2-source-token-validation
          path: hollywood2-source-token-validation-v1.json
          if-no-files-found: error
          retention-days: 30
