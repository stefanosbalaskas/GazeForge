name: Hollywood2 source-token validation

on:
  push:
    branches:
      - main
      - research/hollywood2-source-token-validation
      - validation/hollywood2-source-token-frozen-evidence
      - fix/hollywood2-source-token-runtime-lock
    paths:
      - "src/gazeforge/__init__.py"
      - "src/gazeforge/hollywood2_token_validation.py"
      - "src/gazeforge/hollywood2_token_evidence.py"
      - "src/gazeforge/hollywood2_token_portability_evidence.py"
      - "src/gazeforge/resampling.py"
      - "src/gazeforge/comparison.py"
      - "src/gazeforge/hollywood2.py"
      - "src/gazeforge/events.py"
      - "src/gazeforge/temporal.py"
      - "src/gazeforge/paired.py"
      - "src/gazeforge/stratified.py"
      - "scripts/run_hollywood2_source_token_validation.py"
      - "scripts/validate_hollywood2_source_token_portability.py"
      - "tests/test_hollywood2_token_validation.py"
      - "tests/test_hollywood2_token_evidence.py"
      - "tests/test_hollywood2_token_frozen_evidence.py"
      - "tests/test_hollywood2_token_portability_evidence.py"
      - "tests/test_resampling.py"
      - "validation/governance/hollywood2-source-token-analysis-authorization-v1.json"
      - "validation/governance/hollywood2-source-token-runtime-v1.txt"
      - "validation/evidence/hollywood2/**"
      - "docs/hollywood2-authoritative-evidence.md"
      - ".github/workflows/hollywood2-source-token-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and focused tooling
        run: python -m pip install . pytest ruff
      - name: Ruff source-token portability files
        run: |
          ruff check \
            src/gazeforge/hollywood2_token_evidence.py \
            src/gazeforge/hollywood2_token_portability_evidence.py \
            scripts/run_hollywood2_source_token_validation.py \
            scripts/validate_hollywood2_source_token_portability.py \
            tests/test_hollywood2_token_evidence.py \
            tests/test_hollywood2_token_frozen_evidence.py \
            tests/test_hollywood2_token_portability_evidence.py
      - name: Run source-token, portability, and resampling contract tests
        run: |
          python -m pytest -q \
            tests/test_hollywood2_token_validation.py \
            tests/test_hollywood2_token_evidence.py \
            tests/test_hollywood2_token_frozen_evidence.py \
            tests/test_hollywood2_token_portability_evidence.py \
            tests/test_resampling.py
      - name: Validate committed authorization and portability evidence
        run: |
          python - <<'PY'
          from gazeforge.hollywood2_token_portability_evidence import (
              validate_hollywood2_source_token_portability_evidence,
          )
          from gazeforge.hollywood2_token_validation import (
              authorization_fingerprint,
              load_hollywood2_source_token_analysis_authorization,
          )

          authorization = load_hollywood2_source_token_analysis_authorization(
              "validation/governance/"
              "hollywood2-source-token-analysis-authorization-v1.json"
          )
          portability = validate_hollywood2_source_token_portability_evidence(
              "validation/evidence/hollywood2/"
              "hollywood2-source-token-numeric-portability-evidence-v2.json"
          )
          print("authorization fingerprint:", authorization_fingerprint(authorization))
          print("portability fingerprint:", portability["evidence_fingerprint_sha256"])
          assert authorization.participant_identity_mapping_verified is False
          assert authorization.raw_source_redistribution_authorized is False
          PY

  reviewed-artifact-replay:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Load reviewed execution bindings
        run: |
          python - <<'PY'
          import os

          from gazeforge.hollywood2_token_portability_evidence import (
              validate_hollywood2_source_token_portability_evidence,
          )

          evidence = validate_hollywood2_source_token_portability_evidence(
              "validation/evidence/hollywood2/"
              "hollywood2-source-token-numeric-portability-evidence-v2.json"
          )
          reviewed = evidence["reviewed_source_verified_artifacts"]
          values = {
              "PRE_ARTIFACT_ID": reviewed["pre_merge"]["artifact_id"],
              "PRE_ARTIFACT_ZIP_SHA256": reviewed["pre_merge"]["artifact_zip_sha256"],
              "MERGE_ARTIFACT_ID": reviewed["exact_merge"]["artifact_id"],
              "MERGE_ARTIFACT_ZIP_SHA256": reviewed["exact_merge"]["artifact_zip_sha256"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY
      - name: Download the two reviewed aggregate artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _reviewed/pre _reviewed/merge
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          headers=(
            -H "Authorization: Bearer ${GITHUB_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            "${headers[@]}" \
            "${api}/${PRE_ARTIFACT_ID}/zip" \
            -o _reviewed/pre.zip
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            "${headers[@]}" \
            "${api}/${MERGE_ARTIFACT_ID}/zip" \
            -o _reviewed/merge.zip
          echo "${PRE_ARTIFACT_ZIP_SHA256}  _reviewed/pre.zip" | sha256sum --check --strict
          echo "${MERGE_ARTIFACT_ZIP_SHA256}  _reviewed/merge.zip" | sha256sum --check --strict
          unzip -q _reviewed/pre.zip -d _reviewed/pre
          unzip -q _reviewed/merge.zip -d _reviewed/merge
      - name: Replay historical v1 and portability v2 contracts
        run: |
          python scripts/validate_hollywood2_source_token_portability.py replay \
            --pre-report _reviewed/pre/hollywood2-source-token-validation-v1.json \
            --merge-report _reviewed/merge/hollywood2-source-token-validation-v1.json

  empirical:
    needs: reviewed-artifact-replay
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with frozen empirical runtime
        run: |
          python -m pip install \
            --constraint validation/governance/hollywood2-source-token-runtime-v1.txt \
            .
      - name: Verify frozen empirical runtime
        run: |
          sha256sum validation/governance/hollywood2-source-token-runtime-v1.txt
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "numpy": "2.5.2",
              "pandas": "3.0.5",
              "scikit-learn": "1.9.0",
              "scipy": "1.18.1",
              "joblib": "1.6.0",
              "threadpoolctl": "3.6.0",
              "narwhals": "2.25.0",
              "cloudpickle": "3.1.2",
              "python-dateutil": "2.9.0.post0",
              "six": "1.17.0",
          }
          observed = {name: version(name) for name in expected}
          assert observed == expected, (observed, expected)
          print("frozen empirical runtime verified:", observed)
          PY
      - name: Acquire pinned canonical Hollywood2EM source
        id: acquire
        shell: bash
        run: |
          set -u -o pipefail
          expected="870fa6d6209c9085260918d61433a0a2c70fd497"
          canonical="https://gin.g-node.org/ioannis.agtzidis/hollywood2_em"
          legacy="https://web.gin.g-node.org/ioannis.agtzidis/hollywood2_em"
          canonical_403_count=0
          canonical_attempts=3

          clone_once() {
            local endpoint="$1"
            local label="$2"
            rm -rf _hollywood2_em
            set +e
            output="$(git clone --depth 1 "$endpoint" _hollywood2_em 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [ "$rc" -ne 0 ]; then
              if [ "$label" = "canonical" ] && printf '%s' "$output" | grep -q "403"; then
                canonical_403_count=$((canonical_403_count + 1))
              fi
              return 1
            fi
            observed="$(git -C _hollywood2_em rev-parse HEAD)"
            if [ "$observed" != "$expected" ]; then
              echo "Source was reachable but HEAD identity drifted: ${observed}" >&2
              exit 2
            fi
            if [ -n "$(git -C _hollywood2_em status --porcelain --untracked-files=no)" ]; then
              echo "Source checkout contains tracked modifications." >&2
              exit 2
            fi
            git -C _hollywood2_em remote set-url origin \
              https://gin.g-node.org/ioannis.agtzidis/hollywood2_em.git
            echo "source_available=true" >> "$GITHUB_OUTPUT"
            echo "acquisition_route=${label}" >> "$GITHUB_OUTPUT"
            return 0
          }

          set -e
          for attempt in 1 2 3; do
            if clone_once "$canonical" canonical; then
              echo "Canonical GIN source acquired on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          for attempt in 1 2; do
            if clone_once "$legacy" legacy-alias; then
              echo "Canonical repository bytes acquired through the legacy GIN hostname."
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 15
            fi
          done
          if [ "$canonical_403_count" -eq "$canonical_attempts" ]; then
            echo "source_available=false" >> "$GITHUB_OUTPUT"
            echo "source_unavailable_reason=canonical_gin_http_403" >> "$GITHUB_OUTPUT"
            {
              echo "### Hollywood2 live-source availability"
              echo
              echo "The canonical GIN endpoint returned HTTP 403 on all bounded attempts."
              echo "No source bytes were acquired in this job. Reviewed-artifact replay"
              echo "remains the blocking v1/v2 portability evidence gate."
              echo
              echo "This is not a fresh empirical rerun or a model-validation failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Canonical GIN acquisition failed outside the audited HTTP-403 case." >&2
          exit 1
      - name: Run derived-60-Hz source-token-held-out comparison
        if: steps.acquire.outputs.source_available == 'true'
        run: |
          python scripts/run_hollywood2_source_token_validation.py \
            --source-root _hollywood2_em \
            --target-rate-hz 60 \
            --min-label-purity 0.75 \
            --folds 4 \
            --rf-trees 100 \
            --context-hidden 32,16 \
            --context-max-iter 50 \
            --output hollywood2-source-token-validation-v2.json
      - name: Bind live aggregate report to portability v2 evidence
        if: steps.acquire.outputs.source_available == 'true'
        run: |
          python scripts/validate_hollywood2_source_token_portability.py bind-live \
            --report hollywood2-source-token-validation-v2.json
      - name: Record replay-backed availability fallback
        if: steps.acquire.outputs.source_available == 'false'
        run: |
          python - <<'PY'
          from gazeforge.hollywood2_token_portability_evidence import (
              validate_hollywood2_source_token_portability_evidence,
          )

          evidence = validate_hollywood2_source_token_portability_evidence(
              "validation/evidence/hollywood2/"
              "hollywood2-source-token-numeric-portability-evidence-v2.json"
          )
          print("live source unavailable through audited route")
          print("v2 portability evidence:", evidence["evidence_fingerprint_sha256"])
          print("reviewed artifact replay is the active evidence gate")
          PY
      - name: Upload aggregate validation report only
        if: steps.acquire.outputs.source_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hollywood2-source-token-validation-v2
          path: hollywood2-source-token-validation-v2.json
          if-no-files-found: error
          retention-days: 30
