name: Fix Hollywood2 source-token lint

on:
  push:
    branches:
      - research/hollywood2-source-token-validation
    paths:
      - ".github/workflows/fix-hollywood2-source-token-ruff.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hollywood2-source-token-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve effective resampling-gap provenance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/gazeforge/hollywood2_token_validation.py")
          text = path.read_text(encoding="utf-8")
          old = '            "max_interpolation_gap_ms": max_interpolation_gap_ms,\n'
          new = (
              '            "max_interpolation_gap_ms": (\n'
              '                float(max_interpolation_gap_ms)\n'
              '                if max_interpolation_gap_ms is not None\n'
              '                else 2.0 * (1000.0 / float(target_sampling_rate_hz))\n'
              '            ),\n'
          )
          if old not in text:
              raise SystemExit("expected resampling-gap provenance line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply Ruff fixes
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff check --fix --unsafe-fixes \
            src/gazeforge/hollywood2_token_validation.py \
            tests/test_hollywood2_token_validation.py
          ruff check \
            src/gazeforge/hollywood2_token_validation.py \
            tests/test_hollywood2_token_validation.py
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/gazeforge/hollywood2_token_validation.py \
            tests/test_hollywood2_token_validation.py
          if git diff --cached --quiet; then
            echo "No repair needed."
            exit 0
          fi
          git commit -m "fix: satisfy Hollywood2 validation lint and provenance"
          git push origin HEAD:research/hollywood2-source-token-validation
