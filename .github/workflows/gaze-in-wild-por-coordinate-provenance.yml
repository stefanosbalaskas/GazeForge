name: Gaze-in-the-Wild POR coordinate provenance

on:
  push:
    branches:
      - main
      - research/giw-por-coordinate-semantics
    paths:
      - "src/gazeforge/gaze_in_wild.py"
      - "src/gazeforge/gaze_in_wild_coordinate_evidence.py"
      - "scripts/gaze_in_wild_por_coordinate_probe.py"
      - "tests/test_gaze_in_wild.py"
      - "tests/test_gaze_in_wild_coordinate_evidence.py"
      - "validation/evidence/gaze-in-wild/gaze-in-wild-por-coordinate-semantics-evidence-v1.json"
      - "docs/gaze-in-wild-por-coordinate-semantics.md"
      - ".github/workflows/gaze-in-wild-por-coordinate-provenance.yml"
  pull_request:
    paths:
      - "src/gazeforge/gaze_in_wild.py"
      - "src/gazeforge/gaze_in_wild_coordinate_evidence.py"
      - "scripts/gaze_in_wild_por_coordinate_probe.py"
      - "tests/test_gaze_in_wild.py"
      - "tests/test_gaze_in_wild_coordinate_evidence.py"
      - "validation/evidence/gaze-in-wild/gaze-in-wild-por-coordinate-semantics-evidence-v1.json"
      - "docs/gaze-in-wild-por-coordinate-semantics.md"
      - ".github/workflows/gaze-in-wild-por-coordinate-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and focused tooling
        run: python -m pip install . pytest ruff
      - name: Ruff focused files
        run: |
          ruff check \
            src/gazeforge/gaze_in_wild_coordinate_evidence.py \
            scripts/gaze_in_wild_por_coordinate_probe.py \
            tests/test_gaze_in_wild_coordinate_evidence.py
      - name: Run focused and adapter coordinate tests
        run: |
          python -m pytest -q \
            tests/test_gaze_in_wild_coordinate_evidence.py \
            tests/test_gaze_in_wild.py
      - name: Validate immutable POR evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          from gazeforge.gaze_in_wild_coordinate_evidence import (
              validate_gaze_in_wild_por_coordinate_evidence,
          )

          record = validate_gaze_in_wild_por_coordinate_evidence(
              Path(
                  "validation/evidence/gaze-in-wild/"
                  "gaze-in-wild-por-coordinate-semantics-evidence-v1.json"
              )
          )
          print("evidence fingerprint:", record["evidence_fingerprint_sha256"])
          print(
              "ProcessData POR coordinate space:",
              record["verification"]["processdata_por_coordinate_space"],
          )
          PY
      - name: Revalidate exact pinned first-party processing source
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/RSKothari/Gaze-in-Wild/52262d44e366a53369e10ca73c5f41daf0e8f1e5/DataExtraction/ReadData_function.m"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors "$url" -o _giw_ReadData_function.m
          observed="$(git hash-object _giw_ReadData_function.m)"
          test "$observed" = "36d81839fb9f9eadb1274b998d2a8652fb0840ca"
          python scripts/gaze_in_wild_por_coordinate_probe.py \
            --source _giw_ReadData_function.m \
            --output gaze-in-wild-por-coordinate-live-probe.json
      - name: Verify metadata-only probe boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          probe = json.loads(
              Path("gaze-in-wild-por-coordinate-live-probe.json").read_text(
                  encoding="utf-8"
              )
          )
          assert probe["verification"]["processdata_por_coordinate_space"] == (
              "normalized_scene_image"
          )
          assert probe["verification"]["first_party_pixel_por_claim"] is False
          assert probe["boundaries"]["participant_mapping_verified"] is False
          assert probe["boundaries"]["analysis_use_permitted"] is False
          assert probe["boundaries"]["distribution_equivalence_verified"] is False
          print("metadata-only POR source probe boundary preserved")
          PY
      - name: Upload metadata-only probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaze-in-wild-por-coordinate-live-probe
          path: gaze-in-wild-por-coordinate-live-probe.json
          if-no-files-found: error
          retention-days: 30
