name: Hollywood2 GIN host metadata probe

on:
  push:
    branches:
      - main
      - research/hollywood2-gin-host-metadata
    paths:
      - "src/gazeforge/hollywood2_gin_host_metadata.py"
      - "src/gazeforge/hollywood2_gin_accessible_host_evidence.py"
      - "scripts/hollywood2_gin_host_metadata_probe.py"
      - "tests/test_hollywood2_gin_host_metadata.py"
      - "tests/test_hollywood2_gin_accessible_host_evidence.py"
      - "validation/evidence/hollywood2/hollywood2-gin-host-metadata-evidence-v1.json"
      - "validation/evidence/hollywood2/hollywood2-gin-host-metadata-accessible-evidence-v1.json"
      - "docs/hollywood2-author-license-statement.md"
      - ".github/workflows/hollywood2-gin-host-metadata-probe.yml"
  pull_request:
    paths:
      - "src/gazeforge/hollywood2_gin_host_metadata.py"
      - "src/gazeforge/hollywood2_gin_accessible_host_evidence.py"
      - "scripts/hollywood2_gin_host_metadata_probe.py"
      - "tests/test_hollywood2_gin_host_metadata.py"
      - "tests/test_hollywood2_gin_accessible_host_evidence.py"
      - "validation/evidence/hollywood2/hollywood2-gin-host-metadata-evidence-v1.json"
      - "validation/evidence/hollywood2/hollywood2-gin-host-metadata-accessible-evidence-v1.json"
      - "docs/hollywood2-author-license-statement.md"
      - ".github/workflows/hollywood2-gin-host-metadata-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff host-metadata tranche
        run: >-
          ruff check
          src/gazeforge/hollywood2_gin_host_metadata.py
          src/gazeforge/hollywood2_gin_accessible_host_evidence.py
          scripts/hollywood2_gin_host_metadata_probe.py
          tests/test_hollywood2_gin_host_metadata.py
          tests/test_hollywood2_gin_accessible_host_evidence.py
      - name: Run focused unit tests
        run: >-
          pytest -q
          tests/test_hollywood2_gin_host_metadata.py
          tests/test_hollywood2_gin_accessible_host_evidence.py
      - name: Probe public GIN and DataCite metadata
        run: python scripts/hollywood2_gin_host_metadata_probe.py
      - name: Verify live probe against frozen evidence
        run: |
          python - <<'PY'
          from gazeforge.hollywood2_gin_accessible_host_evidence import (
              validate_hollywood2_gin_accessible_host_live_probe,
          )
          from gazeforge.hollywood2_gin_host_metadata import (
              validate_hollywood2_gin_host_metadata_live_probe,
          )

          probe = "hollywood2_gin_host_metadata_live_probe.json"
          validate_hollywood2_gin_host_metadata_live_probe(
              probe,
              (
                  "validation/evidence/hollywood2/"
                  "hollywood2-gin-host-metadata-evidence-v1.json"
              ),
          )
          validate_hollywood2_gin_accessible_host_live_probe(
              probe,
              (
                  "validation/evidence/hollywood2/"
                  "hollywood2-gin-host-metadata-accessible-evidence-v1.json"
              ),
          )
          print("Fresh host/registry probe preserves both reviewed fail-closed records.")
          PY
      - name: Summarize conservative result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path("hollywood2_gin_host_metadata_live_probe.json").read_text())
          rights = record["rights_interpretation"]
          print("GIN API status:", record["api"]["http_status"])
          print("GIN API JSON object:", record["api"]["json_object"])
          print("GIN license key paths:", record["api"]["license_key_paths"])
          print("GIN page status:", record["page"]["http_status"])
          print("GIN page license keyword:", record["page"]["contains_license_word"])
          print("GIN page licence keyword:", record["page"]["contains_licence_word"])
          for index, query in enumerate(record["datacite_queries"], start=1):
              print(
                  f"DataCite query {index}:",
                  "status=", query["http_status"],
                  "total=", query["reported_total"],
                  "returned=", query["returned_record_count"],
                  "exact_repo_matches=", query["exact_repository_match_count"],
              )
          print("DataCite exact repository matches:", rights["datacite_exact_repository_match_count"])
          print("exact license verified:", rights["exact_license_identifier_verified"])
          print("global absence claim:", rights["registry_zero_match_is_global_absence_claim"])
          print("source audit ready:", record["scientific_boundary"]["source_audit_ready"])
          print("probe fingerprint:", record["probe_fingerprint_sha256"])
          PY
      - name: Upload deterministic host-metadata record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollywood2-gin-host-metadata-live-probe
          path: hollywood2_gin_host_metadata_live_probe.json
          if-no-files-found: error
          retention-days: 30
