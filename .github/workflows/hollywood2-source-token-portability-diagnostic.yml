name: Hollywood2 source-token portability diagnostic

on:
  push:
    branches:
      - fix/hollywood2-source-token-runtime-lock
    paths:
      - "scripts/diagnose_hollywood2_source_token_portability.py"
      - ".github/workflows/hollywood2-source-token-portability-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hollywood2-source-token-portability-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen empirical runtime and diagnostic tooling
        run: |
          python -m pip install \
            --constraint validation/governance/hollywood2-source-token-runtime-v1.txt \
            . ruff
      - name: Ruff diagnostic runner
        run: ruff check scripts/diagnose_hollywood2_source_token_portability.py
      - name: Verify frozen empirical runtime
        run: |
          sha256sum validation/governance/hollywood2-source-token-runtime-v1.txt
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "numpy": "2.5.2",
              "pandas": "3.0.5",
              "scikit-learn": "1.9.0",
              "scipy": "1.18.1",
              "joblib": "1.6.0",
              "threadpoolctl": "3.6.0",
              "narwhals": "2.25.0",
              "cloudpickle": "3.1.2",
              "python-dateutil": "2.9.0.post0",
              "six": "1.17.0",
          }
          observed = {name: version(name) for name in expected}
          assert observed == expected, (observed, expected)
          print("frozen empirical runtime verified:", observed)
          PY
      - name: Download reviewed exact-merge aggregate artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _reviewed
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9966993646/zip" \
            -o _reviewed/exact-merge.zip
          echo "3780e8d7a761e45e917e0229a02eeca332e9200473ef9a7489b1c41c5019a985  _reviewed/exact-merge.zip" \
            | sha256sum --check --strict
          unzip -q _reviewed/exact-merge.zip -d _reviewed/exact-merge
          test -f _reviewed/exact-merge/hollywood2-source-token-validation-v1.json
          sha256sum _reviewed/exact-merge/hollywood2-source-token-validation-v1.json
      - name: Acquire pinned canonical Hollywood2EM source
        shell: bash
        run: |
          set -u -o pipefail
          expected="870fa6d6209c9085260918d61433a0a2c70fd497"
          canonical="https://gin.g-node.org/ioannis.agtzidis/hollywood2_em"
          legacy="https://web.gin.g-node.org/ioannis.agtzidis/hollywood2_em"

          clone_once() {
            local endpoint="$1"
            rm -rf _hollywood2_em
            if ! git clone --depth 1 "$endpoint" _hollywood2_em; then
              return 1
            fi
            observed="$(git -C _hollywood2_em rev-parse HEAD)"
            if [ "$observed" != "$expected" ]; then
              echo "Source HEAD drifted: ${observed}" >&2
              exit 2
            fi
            if [ -n "$(git -C _hollywood2_em status --porcelain --untracked-files=no)" ]; then
              echo "Source checkout contains tracked modifications." >&2
              exit 2
            fi
            return 0
          }

          set -e
          for attempt in 1 2 3; do
            if clone_once "$canonical"; then
              echo "Canonical GIN source acquired on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          for attempt in 1 2; do
            if clone_once "$legacy"; then
              echo "Canonical repository bytes acquired through legacy GIN hostname."
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 15
            fi
          done
          echo "Unable to acquire the pinned canonical source for diagnostic rerun." >&2
          exit 1
      - name: Diagnose full-report portability precision
        run: |
          python scripts/diagnose_hollywood2_source_token_portability.py \
            --source-root _hollywood2_em \
            --reviewed-raw \
              _reviewed/exact-merge/hollywood2-source-token-validation-v1.json \
            --raw-output hollywood2-source-token-live-raw-diagnostic.json \
            --diagnostic-output hollywood2-source-token-portability-diagnostic.json
      - name: Upload aggregate diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollywood2-source-token-portability-diagnostic
          path: |
            hollywood2-source-token-live-raw-diagnostic.json
            hollywood2-source-token-portability-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
