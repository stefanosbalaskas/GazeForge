<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Synthetic dynamic AOI snapshots</title>
<desc id="desc">Three demo snapshots at 0, 50, and 100 milliseconds showing a product AOI moving horizontally. The middle geometry is explicitly labelled interpolated. Synthetic software-demo data only.</desc>
<rect x="1" y="1" width="958" height="428" rx="20" fill="#fff" stroke="#d7dce3"/>
<text x="54" y="45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#111827">Dynamic AOI snapshots</text>
<rect x="748" y="20" width="160" height="30" rx="15" fill="#f3f4f6" stroke="#9ca3af"/><text x="828" y="40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#374151">SYNTHETIC / DEMO</text>
<text x="54" y="72" font-family="Arial" font-size="14" fill="#4b5563">Interpolation is bounded between observed keyframes; no temporal extrapolation is shown.</text>
<g font-family="Arial"><text x="183" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">0 ms · keyframe</text><text x="480" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">50 ms · interpolated</text><text x="777" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">100 ms · keyframe</text></g>
<g fill="#f9fafb" stroke="#d1d5db"><rect x="55" y="130" width="256" height="210" rx="8"/><rect x="352" y="130" width="256" height="210" rx="8"/><rect x="649" y="130" width="256" height="210" rx="8"/></g>
<rect x="88" y="176" width="120" height="112" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="420" y="176" width="120" height="112" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 6"/><rect x="752" y="176" width="120" height="112" fill="none" stroke="#2563eb" stroke-width="3"/>
<g font-family="Arial" font-size="12" font-weight="700" fill="#1d4ed8"><text x="98" y="198">product · D01</text><text x="430" y="198">product · D01</text><text x="762" y="198">product · D01</text></g>
<g stroke="#374151" stroke-width="2"><line x1="213" y1="232" x2="411" y2="232"/><line x1="545" y1="232" x2="743" y2="232"/></g><g fill="#374151"><path d="M411 232l-10-6v12z"/><path d="M743 232l-10-6v12z"/></g>
<circle cx="480" cy="232" r="7" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="480" y="314" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">fixation inside interpolated geometry</text>
<text x="905" y="392" text-anchor="end" font-family="Arial" font-size="11" fill="#6b7280">Illustrative synthetic track — not dynamic-AOI empirical validation.</text>
</svg>