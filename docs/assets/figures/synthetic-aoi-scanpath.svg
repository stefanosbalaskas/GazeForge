<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Synthetic semantic AOI and scanpath overlay</title>
<desc id="desc">Three labelled rectangular areas of interest named logo, nutrition claim, and product, with a five-fixation scanpath connected by arrows and numbered points. Synthetic software-demo data only.</desc>
<rect x="1" y="1" width="958" height="558" rx="20" fill="#fff" stroke="#d7dce3"/>
<text x="54" y="45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#111827">Semantic AOIs + scanpath</text>
<rect x="748" y="20" width="160" height="30" rx="15" fill="#f3f4f6" stroke="#9ca3af"/><text x="828" y="40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#374151">SYNTHETIC / DEMO</text>
<text x="54" y="72" font-family="Arial" font-size="14" fill="#4b5563">Rectangles are explicitly labelled; numbered fixation order does not depend on colour.</text>
<rect x="70" y="120" width="210" height="125" fill="none" stroke="#2563eb" stroke-width="3"/><text x="82" y="143" font-family="Arial" font-size="14" font-weight="700" fill="#1d4ed8">logo · A01</text>
<rect x="585" y="125" width="290" height="130" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 6"/><text x="598" y="148" font-family="Arial" font-size="14" font-weight="700" fill="#0f766e">nutrition claim · A02</text>
<rect x="310" y="285" width="360" height="210" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="3 6"/><text x="323" y="309" font-family="Arial" font-size="14" font-weight="700" fill="#92400e">product · A03</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<polyline points="150,184 690,185 520,372 405,430 760,205" fill="none" stroke="#374151" stroke-width="2.5" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
<g fill="#fff" stroke="#111827" stroke-width="3"><circle cx="150" cy="184" r="18"/><circle cx="690" cy="185" r="18"/><circle cx="520" cy="372" r="18"/><circle cx="405" cy="430" r="18"/><circle cx="760" cy="205" r="18"/></g>
<g font-family="Arial" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" dominant-baseline="middle"><text x="150" y="184">1</text><text x="690" y="185">2</text><text x="520" y="372">3</text><text x="405" y="430">4</text><text x="760" y="205">5</text></g>
<text x="150" y="216" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">logo</text><text x="690" y="218" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">claim</text><text x="520" y="405" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">product</text><text x="405" y="464" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">product</text><text x="760" y="237" text-anchor="middle" font-family="Arial" font-size="11" fill="#374151">claim</text>
<text x="906" y="530" text-anchor="end" font-family="Arial" font-size="11" fill="#6b7280">Illustrative synthetic layout — no semantic-detection accuracy claim.</text>
</svg>