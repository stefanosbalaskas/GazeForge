<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">Evidence ladder</title>
<desc id="desc">A layered diagram separating observations, diagnostics, review decisions, analysis outputs, validation evidence and scientific claims.</desc>
<style>.bg{fill:#fff}.box{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.accent{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.title{font:700 22px system-ui,sans-serif;fill:#0f172a}.label{font:650 16px system-ui,sans-serif;fill:#0f172a}@media(prefers-color-scheme:dark){.bg{fill:#0f172a}.box{fill:#1e293b;stroke:#818cf8}.accent{fill:#164e63;stroke:#22d3ee}.warn{fill:#431407;stroke:#fb923c}.title,.label{fill:#f8fafc}}</style>
<rect class="bg" width="1100" height="480" rx="24"/>
<text class="title" x="60" y="55">Evidence ladder</text>
<rect class="box" x="80" y="350" width="940" height="62" rx="14"/><text class="label" x="550" y="388" text-anchor="middle">Observed data · source identity · acquisition context</text>
<rect class="accent" x="150" y="276" width="800" height="62" rx="14"/><text class="label" x="550" y="314" text-anchor="middle">QC diagnostics · predictions · uncertainty</text>
<rect class="accent" x="220" y="202" width="660" height="62" rx="14"/><text class="label" x="550" y="240" text-anchor="middle">Review decisions · denominators · approved derivatives</text>
<rect class="box" x="290" y="128" width="520" height="62" rx="14"/><text class="label" x="550" y="166" text-anchor="middle">Analysis + validation evidence</text>
<rect class="warn" x="360" y="54" width="380" height="62" rx="14"/><text class="label" x="550" y="92" text-anchor="middle">Bounded scientific claim</text>
</svg>
