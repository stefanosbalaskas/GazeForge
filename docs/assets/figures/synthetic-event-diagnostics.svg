<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Synthetic event probabilities and calibration diagnostics</title>
<desc id="desc">Two demo panels. Left: fixation, saccade, and noise probabilities over time with distinct dash patterns and a confidence threshold. Right: observed calibration points against an ideal diagonal. Synthetic software-demo data only.</desc>
<rect x="1" y="1" width="958" height="498" rx="20" fill="#fff" stroke="#d7dce3"/>
<text x="54" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#111827">Probabilities + calibration</text>
<rect x="748" y="20" width="160" height="30" rx="15" fill="#f3f4f6" stroke="#9ca3af"/><text x="828" y="40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#374151">SYNTHETIC / DEMO</text>
<text x="54" y="70" font-family="Arial" font-size="14" fill="#4b5563">Different line styles and point labels keep meaning available beyond colour.</text>
<text x="60" y="106" font-family="Arial" font-size="16" font-weight="700" fill="#374151">Event probabilities</text>
<line x1="62" y1="392" x2="520" y2="392" stroke="#9ca3af"/><line x1="62" y1="124" x2="62" y2="392" stroke="#9ca3af"/>
<line x1="62" y1="258" x2="520" y2="258" stroke="#e5e7eb"/><line x1="62" y1="177" x2="520" y2="177" stroke="#e5e7eb"/>
<line x1="62" y1="231" x2="520" y2="231" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 6"/><text x="438" y="224" font-family="Arial" font-size="11" fill="#4b5563">0.60 threshold</text>
<polyline points="62,177 108,162 154,171 200,204 246,250 292,292 338,301 384,267 430,212 476,174 520,166" fill="none" stroke="#2563eb" stroke-width="3"/>
<polyline points="62,313 108,292 154,255 200,217 246,186 292,180 338,205 384,249 430,292 476,315 520,302" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 7"/>
<polyline points="62,363 108,365 154,358 200,352 246,345 292,337 338,335 384,341 430,352 476,357 520,361" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="3 6"/>
<line x1="76" y1="136" x2="106" y2="136" stroke="#2563eb" stroke-width="3"/><text x="114" y="140" font-family="Arial" font-size="12" fill="#374151">fixation — solid</text><line x1="220" y1="136" x2="250" y2="136" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 7"/><text x="258" y="140" font-family="Arial" font-size="12" fill="#374151">saccade — dashed</text><line x1="385" y1="136" x2="415" y2="136" stroke="#b45309" stroke-width="3" stroke-dasharray="3 6"/><text x="423" y="140" font-family="Arial" font-size="12" fill="#374151">noise — dotted</text>
<text x="291" y="424" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">time (ms)</text><text x="28" y="258" transform="rotate(-90 28 258)" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">probability</text>
<text x="588" y="106" font-family="Arial" font-size="16" font-weight="700" fill="#374151">Top-label calibration</text>
<line x1="590" y1="392" x2="900" y2="392" stroke="#9ca3af"/><line x1="590" y1="124" x2="590" y2="392" stroke="#9ca3af"/>
<line x1="590" y1="392" x2="900" y2="124" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 7"/><text x="832" y="170" font-family="Arial" font-size="11" fill="#4b5563">ideal</text>
<polyline points="652,330 704,294 756,238 806,206 857,157" fill="none" stroke="#7c3aed" stroke-width="3"/>
<g fill="#fff" stroke="#7c3aed" stroke-width="3"><circle cx="652" cy="330" r="6"/><circle cx="704" cy="294" r="6"/><circle cx="756" cy="238" r="6"/><circle cx="806" cy="206" r="6"/><circle cx="857" cy="157" r="6"/></g>
<text x="658" y="321" font-family="Arial" font-size="10" fill="#374151">n=18</text><text x="710" y="285" font-family="Arial" font-size="10" fill="#374151">n=31</text><text x="762" y="229" font-family="Arial" font-size="10" fill="#374151">n=42</text><text x="812" y="197" font-family="Arial" font-size="10" fill="#374151">n=51</text><text x="863" y="148" font-family="Arial" font-size="10" fill="#374151">n=38</text>
<text x="745" y="424" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">mean confidence</text><text x="558" y="258" transform="rotate(-90 558 258)" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">empirical accuracy</text>
<text x="908" y="474" text-anchor="end" font-family="Arial" font-size="11" fill="#6b7280">Illustrative synthetic data — not classifier validation.</text>
</svg>